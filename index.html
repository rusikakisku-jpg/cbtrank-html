    .hamburger {

      width: 40px; height: 40px;

      border-radius: 8px; transition: background 0.2s;
    }
    .hamburger:hover { background: rgba(255,255,255,0.15); }
    .hamburger span {
      display: block; width: 22px; height: 2px;
      background: #fff; border-radius: 2px; transition: all 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

      display: none;
      background: #003399;

      padding: 0 24px;
    }
    .mobile-drawer.open { display: block; max-height: 300px; padding: 12px 24px 16px; }
    .mobile-drawer a {
      display: block; color: #fff; font-weight: 600; font-size: 0.95rem;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.15);
      transition: color 0.2s;
    }
    .mobile-drawer a:last-child { border-bottom: none; }
    .mobile-drawer a:hover { color: #bfdbfe; }

    /* MAIN */
    main { flex: 1; width: 95%; max-width: 1200px; margin: 0 auto; padding: 28px 0 48px; }
    .mobile-cta { display: none; margin-bottom: 24px; }

    /* CTA BUTTON */
    .btn-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 60%, #3730a3 100%);
      color: #fff; font-weight: 700; font-size: 0.95rem;
      padding: 14px 24px; border-radius: 12px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
      transition: all 0.2s ease; white-space: nowrap;
      text-decoration: none; border: none; cursor: pointer;
    }
    .btn-cta:hover { opacity: 0.93; box-shadow: 0 6px 18px rgba(37,99,235,0.4); transform: translateY(-1px); }
    .btn-cta.full-width { width: 100%; font-size: 1rem; padding: 14px 20px; }
    .btn-cta.large { font-size: 1.05rem; padding: 16px 28px; width: 100%; }
    .btn-cta svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* LAYOUT GRID */
    .content-grid { display: grid; gap: 32px; }
    .content-grid.two-col { grid-template-columns: 1fr 1fr; }

    /* SECTION HEADER */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .section-title { font-size: 1.5rem; font-weight: 900; color: #0f172a; letter-spacing: -0.03em; }
    .section-subtitle { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

    /* EXAM CARDS */
    .exam-list { display: grid; gap: 10px; }
    .exam-card {
      background: #fff; border: 1.5px solid #e2e8f0;
      border-radius: 14px; box-shadow: 0 1px 4px rgba(15,23,42,0.05);
      transition: all 0.2s ease; overflow: hidden;

    .exam-card:hover { border-color: #0b69ff; box-shadow: 0 4px 16px rgba(11,105,255,0.12); transform: translateY(-1px); }

    .exam-card-left { flex: 1; min-width: 0; }
    .exam-title {
      font-size: 1rem; font-weight: 700; color: #0b69ff;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      transition: color 0.2s; line-height: 1.4;
    }
    .exam-card:hover .exam-title { color: #1d4ed8; }
    .badge-latest {
      background: #ef4444; color: #fff;
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px; letter-spacing: 0.04em;
      animation: pulse 1.8s infinite; white-space: nowrap;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .exam-subtitle { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
    .exam-arrow { color: #cbd5e1; flex-shrink: 0; transition: all 0.2s ease; }
    .exam-card:hover .exam-arrow { color: #0b69ff; transform: translateX(3px); }
    .exam-arrow svg { width: 20px; height: 20px; }
    .empty-state {
      background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px;

    /* SIDEBAR */

    .blog-grid { display: grid; gap: 20px; }
    .blog-card {
      background: #fff; border: 1.5px solid #e2e8f0; border-radius: 16px;
      overflow: hidden; transition: all 0.2s ease;
      display: flex; flex-direction: column;

    .blog-card:hover { border-color: #0b69ff; box-shadow: 0 4px 16px rgba(11,105,255,0.12); transform: translateY(-2px); }
    .blog-img-wrap { width: 100%; height: 200px; background: #f1f5f9; overflow: hidden; }

    .blog-content { padding: 16px 18px; }
    .blog-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; line-height: 1.45; margin-bottom: 6px; transition: color 0.2s; }

    .blog-date { font-size: 0.72rem; color: #94a3b8; font-weight: 500; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; }

      .footer-copy { text-align: center; white-space: normal; }
    }
    @media (max-width: 480px) {

    /* ============================================================
       SECURITY UTILITY: XSS Prevention / HTML Escaping
    ============================================================ */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* ============================================================
       RENDER EXAMS (Safe & Secure)
    ============================================================ */
    function renderExams() {
      const list = document.getElementById('exam-list');
      if (!EXAMS || !Array.isArray(EXAMS) || EXAMS.length === 0) {
        list.innerHTML = '<div class="empty-state">अभी कोई updates उपलब्ध नहीं हैं।</div>';
        return;
      }

      list.innerHTML = EXAMS.map(e => {
        const safeTitle = escapeHtml(e.title);
        const safeSubtitle = escapeHtml(e.subtitle);
        const safeSlug = encodeURIComponent(e.slug || '');
        const isLatest = Number(e.is_latest) === 1;

        return `
          <div class="exam-card">
            <a href="${safeSlug}/answerkey" aria-label="${safeTitle}">
              <div class="exam-card-left">
                <div class="exam-title">
                  <span>${safeTitle}</span>
                  ${isLatest ? '<span class="badge-latest">Latest</span>' : ''}
                </div>
                ${safeSubtitle ? `<p class="exam-subtitle">${safeSubtitle}</p>` : ''}
              </div>
              <div class="exam-arrow" aria-hidden="true">
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
              </div>
            </a>
          </div>
        `;
      }).join('');
    }

    /* ============================================================
       RENDER BLOGS
    ============================================================ */
    function renderBlogs() {
      const grid = document.getElementById('blog-grid');
      if (!BLOGS.length) return;
      grid.innerHTML = BLOGS.map((b, i) => `
        <a href="/${b.slug}" class="blog-card">
          <div class="blog-img-wrap">
            <img src="${b.image}" alt="${b.title}"
              loading="${i === 0 ? 'eager' : 'lazy'}"
              decoding="async"
              width="400" height="200"
              fetchpriority="${i === 0 ? 'high' : 'low'}">
          </div>
          <div class="blog-content">
            <div class="blog-title">${b.title}</div>
            <p class="blog-desc">${b.description}</p>
            <div class="blog-date">&#128336; ${b.created_at}</div>
          </div>
        </a>
      `).join('');
    }

    /* ============================================================
       SETUP LAYOUT (Dynamic D1 show_blogs_section toggle)
    ============================================================ */
    let SHOW_BLOGS = false;

    function setupLayout(showBlogs = false) {
      SHOW_BLOGS = Boolean(showBlogs);
      const grid = document.getElementById('content-grid');
      const sidebar = document.getElementById('sidebar-section');
      const navBlogLi = document.getElementById('nav-blog-li');
      const mobileBlogLink = document.getElementById('mobile-blog-link');
      const desktopInlineCta = document.getElementById('desktop-inline-cta');

      if (SHOW_BLOGS) {
        if (grid) grid.classList.add('two-col');
        if (sidebar) sidebar.style.display = 'block';
        if (navBlogLi) navBlogLi.style.display = 'list-item';
        if (mobileBlogLink) mobileBlogLink.style.display = 'block';
        if (desktopInlineCta) desktopInlineCta.style.display = 'none';
        renderBlogs();
      } else {
        if (grid) grid.classList.remove('two-col');
        if (sidebar) sidebar.style.display = 'none';
        if (navBlogLi) navBlogLi.style.display = 'none';
        if (mobileBlogLink) mobileBlogLink.style.display = 'none';
        if (desktopInlineCta) desktopInlineCta.style.display = '';
      }
    }

    /* FOOTER YEAR */
    const footerCopy = document.getElementById('footer-copy');
    if (footerCopy) {
      footerCopy.textContent = `\u00A9 ${new Date().getFullYear()} CBTRANK.COM | All Rights Reserved`;
    }

    /* ============================================================
       DYNAMIC D1 & LOCAL EXAMS FETCH (Bulletproof 0ms Load)
    ============================================================ */
    /* ============================================================
       DYNAMIC D1 & LOCAL EXAMS FETCH (Bulletproof Server Sync)
    ============================================================ */
    async function loadExamsData() {
      // 1. Fetch live D1 exams & D1 settings via server-side get_exams.php
      try {
        let res = await fetch('/get_exams.php');
        if (!res.ok) res = await fetch('get_exams.php');
        if (res.ok) {
          const data = await res.json();
          let liveExams = [];
          let settingsObj = {};

          if (Array.isArray(data)) {
            liveExams = data;
          } else if (data && typeof data === 'object') {
            liveExams = data.exams || [];
            settingsObj = data.settings || {};
          }

          if (Array.isArray(liveExams) && liveExams.length > 0) {
            EXAMS = liveExams;
            renderExams();
          }

          // Handle show_blogs_section toggle directly from D1 settings!
          if (settingsObj && settingsObj.hasOwnProperty('show_blogs_section')) {
            const showBlogVal = String(settingsObj['show_blogs_section'] ?? '1').trim();
            try { localStorage.setItem('cbtrank_show_blogs', showBlogVal); } catch (err) {}
            setupLayout(showBlogVal === '1');
          }
          return;
        }
      } catch (e) {}

      // 2. Fallback to local d1_exams.json
      try {
        let res = await fetch('/d1_exams.json');
        if (!res.ok) res = await fetch('d1_exams.json');
        if (res.ok) {
          const localExams = await res.json();
          if (Array.isArray(localExams) && localExams.length > 0) {
            EXAMS = localExams;
            renderExams();
          }
        }
      } catch (e) {
        renderExams();
      }
    }

    /* INIT (Instant 0ms Seamless Unified Load) */
    function initApp() {
      // Check cached setting or default true for instant 0ms unified render
      let initialShowBlogs = true;
      try {
        const cached = localStorage.getItem('cbtrank_show_blogs');
        if (cached !== null) initialShowBlogs = (cached === '1');
      } catch (err) {}

      renderExams();
      setupLayout(initialShowBlogs);
      loadExamsData();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
