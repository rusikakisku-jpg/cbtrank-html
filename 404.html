<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting | CBT RANK</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-card {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0044cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var path = window.location.pathname;
      var parts = path.split('/').filter(Boolean);
      
      var basePrefix = '/';
      if (parts.length > 0 && parts[0] === 'cbtrank-html') {
        basePrefix = '/cbtrank-html/';
        parts.shift();
      }

      var lastSegment = parts.length > 0 ? parts[parts.length - 1].toLowerCase() : '';
      
      // Check if URL is exam slug format (e.g. /answerkey/slug or /slug/answerkey)
      var slug = '';
      if (parts.length >= 2) {
        var firstSeg = parts[0].toLowerCase();
        var lastSeg = parts[parts.length - 1].toLowerCase();
        if (firstSeg === 'answerkey' || firstSeg === 'answerkey.html') {
          slug = parts[1];
        } else if (lastSeg === 'answerkey' || lastSeg === 'answerkey.html') {
          slug = parts[parts.length - 2];
        }
      }

      if (slug) {
        try { sessionStorage.setItem('cbtrank_pending_slug', slug); } catch(e) {}
        window.location.replace(basePrefix + 'answerkey.html');
        return;
      }

      var knownPages = {
        'answerkey': 'answerkey.html',
        'about-us': 'about-us.html',
        'contact-us': 'contact-us.html',
        'privacy-policy': 'privacy-policy.html',
        'terms-and-conditions': 'terms-and-conditions.html',
        'disclaimer': 'disclaimer.html',
        'result': 'result.html'
      };

      if (knownPages[lastSegment]) {
        window.location.replace(basePrefix + knownPages[lastSegment]);
      } else {
        window.location.replace(basePrefix);
      }
    })();
  </script>
</head>
<body>
  <div class="loading-card">
    <div class="spinner"></div>
    <h3>Redirecting to CBT RANK...</h3>
  </div>
</body>
</html>
