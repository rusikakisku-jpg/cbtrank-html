<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting | CBT RANK</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-card {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0044cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var path = window.location.pathname;
      var parts = path.split('/').filter(Boolean);
      
      var slug = '';
      for (var i = 0; i < parts.length; i++) {
        var segment = parts[i].toLowerCase();
        if (segment === 'answerkey' || segment === 'answerkey.html') {
          if (i > 0) {
            var prev = parts[i - 1];
            if (prev !== 'cbtrank-html' && prev !== 'index' && prev !== 'index.html') {
              slug = prev;
            }
          }
          break;
        }
      }

      var basePrefix = '/';
      if (parts.length > 0 && parts[0] === 'cbtrank-html') {
        basePrefix = '/cbtrank-html/';
      }

      if (slug) {
        window.location.replace(basePrefix + 'answerkey.html?exam=' + encodeURIComponent(slug));
      } else {
        window.location.replace(basePrefix + 'answerkey.html');
      }
    })();
  </script>
</head>
<body>
  <div class="loading-card">
    <div class="spinner"></div>
    <h3>Redirecting to CBT RANK...</h3>
  </div>
</body>
</html>
